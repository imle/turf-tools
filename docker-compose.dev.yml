# Local-dev Postgres for Turf Tools.
#
# Used by `pnpm dev` (the `dev:db` script invokes `docker compose -f
# docker-compose.dev.yml up postgres`). Both the web app and the data
# service connect to it via DATABASE_URL.
#
# `pnpm dev:search` starts the `quickwit` service here. It reaches host
# Postgres via host.docker.internal; `QW_METASTORE_URI` is set by
# packages/db/src/dev-search.ts from DATABASE_URL.
#
# The `osmium` service is build-only (profile `tools`): the data service
# runs `docker run --rm turf-tools-osmium …` when osmium-tool is not on
# the host PATH. It is not started by `dev:db`.
#
# Tests do NOT use this — they use in-process PGlite for speed.
# Production uses a managed Postgres elsewhere; this file is dev-only.
services:
  #  postgres:
  #    image: postgres:17
  #    ports:
  #      - "127.0.0.1:5432:5432"
  #    environment:
  #      POSTGRES_USER: postgres
  #      POSTGRES_PASSWORD: postgres
  #      POSTGRES_DB: postgres
  #    volumes:
  #      - postgres-data:/var/lib/postgresql/data
  #    healthcheck:
  #      test: ["CMD-SHELL", "pg_isready -U postgres"]
  #      interval: 2s
  #      timeout: 2s
  #      retries: 30

  quickwit:
    image: quickwit/quickwit:v0.9.3
    command: ["run", "--config", "/quickwit/config/node.yaml"]
    ports:
      - "127.0.0.1:7280:7280"
    environment:
      QW_LISTEN_ADDRESS: "0.0.0.0"
      QW_DATA_DIR: /qwdata
      QW_METASTORE_URI: ${QW_METASTORE_URI:-postgres://postgres:postgres@host.docker.internal:5432/quickwit}
      QW_DISABLE_TELEMETRY: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./apps/data/qwdata:/qwdata
      - ./apps/data/quickwit/node.yaml:/quickwit/config/node.yaml:ro

  osmium:
    profiles: ["tools"]
    build: ./apps/data/docker/osmium
    image: turf-tools-osmium
    entrypoint: ["osmium"]

volumes:
  postgres-data:
