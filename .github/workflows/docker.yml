name: Docker

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          # Inlined into the web client bundle at build time (see apps/web/Dockerfile).
          VITE_MAPTILER_KEY: ${{ secrets.VITE_MAPTILER_KEY }}
          VITE_MAPTILER_STYLE_ID_LIGHT: ${{ secrets.VITE_MAPTILER_STYLE_ID_LIGHT }}
          VITE_MAPTILER_STYLE_ID_DARK: ${{ secrets.VITE_MAPTILER_STYLE_ID_DARK }}
        # main → :latest; other branches → :<branch> (plus :sha-<commit> either way)
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            bash deploy/build-images.sh
          else
            bash deploy/build-images.sh --tag "${{ github.ref_name }}"
          fi
